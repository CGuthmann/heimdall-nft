[package]
name = "heimdall-nft"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
heimdall = {git = "https://github.com/CGuthmann/heimdall-rs.git", branch = "feature/rapid_witnesscalc"}
nft = {git = "https://github.com/CGuthmann/sfnfts.git", branch = "feature/child_nft"}
ledger_authority = {git = "https://github.com/CGuthmann/sfnfts.git", branch = "feature/child_nft"}
crypto = {git = "https://github.com/CGuthmann/heimdall-rs.git", branch = "feature/rapid_witnesscalc"}
serde_json = "1.0.9"
serde = { version = "1.0", features = ["derive"] }
num-bigint = { version = "0.4",features = ["serde", "rand"]}
num-traits = {version = "0.2.11"}
rand = "0.5.4"

